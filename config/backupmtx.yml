# OBS -> RTMP ingest
rtmp: yes
rtmpAddress: :1935

#runOnPublish: "curl -X POST http://your-api/verify-key -d 'path=%path%&user=%user%&pass=%pass%'" # for validating the keys
#runOnPublishRestart: yes
paths:
  all:
    source: publisher

    runOnReady: >
      ffmpeg -i "rtmp://localhost:1935/$MTX_PATH"
      -preset veryfast -g 48 -sc_threshold 0
      -map v:0 -map a:0 -s:v:0 1920x1080 -b:v:0 6000k -maxrate:v:0 6500k -bufsize:v:0 12000k -b:a:0 128k
      -map v:0 -map a:0 -s:v:1 1280x720  -b:v:1 3000k -maxrate:v:1 3300k -bufsize:v:1 6000k  -b:a:1 128k
      -map v:0 -map a:0 -s:v:2 854x480   -b:v:2 1200k -maxrate:v:2 1500k -bufsize:v:2 3000k  -b:a:2 96k
      -var_stream_map "v:0,a:0 v:1,a:1 v:2,a:2"
      -hls_segment_filename "/hls/$MTX_PATH/v%v/seg%d.ts"
      -hls_time 4 -hls_list_size 8 -hls_flags independent_segments
      -master_pl_name "master.m3u8"
      "/hls/$MTX_PATH/v%v/index.m3u8"

    runOnReadyRestart: yes


