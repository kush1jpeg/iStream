worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
        proxy_cache_path /data/nginx/cache keys_zone=cache:10m;


    server {
        listen 8888;
        server_name _;

        location /socket.io/ {
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;

        }

        # API requests (with rate limiting)
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend:4000; #to send the req to backend service
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # streamId -> key resolution, and then serve the file from the /hls/ directory
        location ~ ^/hls/(?<stream_id>[^/]+)/(?<file>.+)$ {
            auth_request /_resolve;
            auth_request_set $stream_key $upstream_http_x_stream_key;
            rewrite ^ /hls-serve/$stream_key/$file break;
        }

        # to get the streamkey
        location = /_resolve {
            internal;
            proxy_pass http://job-server:3000/resolve-stream;
            proxy_cache cache;
            proxy_cache_valid 200 5s;
            proxy_cache_key $request_uri; 
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

# after redirecting to /hls-serve/ serve the file from the /hls/ directory
        location /hls-serve/ {
            internal;
            alias /hls/;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Headers *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }


    }
}

