services:
  nginx:
    image: nginx:latest
    container_name: staticServe
    ports:
      - "8888:8888"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - hls_data:/hls:ro
    restart: unless-stopped
    networks:
      - istream


  mediamtx:
    build: ./config/mediamtx/
    container_name: mediamtx
    depends_on:
    - rabbitmq
    ports:
    - "1935:1935"    #OBS RTMP
    volumes:
      - ./config/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    networks:
      - istream

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - istream


  auto-scaler:
    build: ./autoScaler/
    container_name: auto-scaler
    depends_on:
      - rabbitmq
      - redis
    env_file:
      - ./autoScaler/.env
    networks:
      - istream
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped


  job-server:
    build: ./jobServer/
    container_name: job-server
    depends_on:
      - rabbitmq
    env_file:
      - ./jobServer/.env
    restart: unless-stopped
    networks:
      - istream


  backend:
    build: ./backend/
    env_file:
      - ./backend/.env
    container_name: main-backend
    depends_on:
      - rabbitmq
      - redis
      - job-server
    restart: unless-stopped
    networks:
      - istream


  notification-service:
    build: ./notification/
    env_file:
      - ./notification/.env
    container_name: notification-service
    depends_on:
      - rabbitmq
      - redis
      - backend
    restart: unless-stopped
    networks:
      - istream


  redis:
    image: "redis:alpine"
    restart: always
    ports:
      - "6379"
    networks:
      - istream
    volumes:
      - redis_data:/data

volumes:
  hls_data:
    name: hls_data  # doing this the name stays hls_data; as docker changes the name based on dir name
  rabbitmq_data:
  redis_data:

networks:
  istream:
    name: istream


