  # Redis
  redis:
    image: redis:8.2
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - appnet
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]

volumes:
  es_data:
    driver: local

  networks:
  appnet:
    driver: bridge

