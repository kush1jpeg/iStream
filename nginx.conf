worker_processes 1;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # raw HLS output
            hls on;
            hls_path /hls/raw;
            hls_fragment 4s;
            hls_playlist_length 30s;

            on_publish http://backend:3000/stream/start;
            on_publish_done http://backend:3000/stream/stop;
        }
    }
}

http {
    server {
        listen 8080;
        location / {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            root /hls;
            add_header Cache-Control no-cache;
        }
    }
}


