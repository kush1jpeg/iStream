<!DOCTYPE html>
<html>
<body style="background:black">
<video id="v" controls autoplay muted width="800"></video>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
  const url = "http://localhost:8888/hls/live/kush/master.m3u8";
  const video = document.getElementById("v");

  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
  } else {
    video.src = url;
  }
</script>
</body>
</html>
